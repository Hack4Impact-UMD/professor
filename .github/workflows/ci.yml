name: CI Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  GOMODCACHE: ${{ github.workspace }}/.gocache/mod
  GOCACHE: ${{ github.workspace }}/.gocache/build

jobs:
  go-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.gocache
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: Download Go modules
        run: go mod download

  go-fmt:
    needs: go-deps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules and build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.gocache
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l $(go list -f '{{.Dir}}' ./...))
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

  go-vet:
    needs: go-deps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules and build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.gocache
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: go vet
        run: go vet ./...

  go-fix:
    needs: go-deps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules and build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.gocache
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: Check go fix
        run: |
          go fix ./...
          git diff --exit-code

  go-test:
    needs: go-deps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules and build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.gocache
          key: gocache-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install playwright reporter deps
        working-directory: playwright/reporter
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: playwright/reporter
        run: pnpm exec playwright install --with-deps chromium

      - name: Write test env
        run: |
          cat <<'EOF' > .env.test
          DEV=true
          PROJECT_ID=professor-ci-test
          EOF

      - name: go test
        run: go test ./...

  terraform-fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate -no-color
